<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Appointments | HMS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" />
</head>

<body class="grey lighten-4">
  <nav class="teal">
    <div class="nav-wrapper container">
      <a href="/dashboard" class="brand-logo">HMS</a>
      <ul class="right">
        <li><a href="/dashboard">Dashboard</a></li>
        <li id="bookNavItem" style="display:none;">
          <a href="/appointments/new">Book Appointment</a>
        </li>
      </ul>
    </div>
  </nav>

  <main class="container" style="margin-top: 35px;">
    <div class="row">
      <div class="col s12 m8">
        <h4>Appointments</h4>
        <p class="grey-text text-darken-1">
          Reception can manage bookings. Doctors can view their scheduled patient visits.
        </p>
      </div>

      <div class="col s12 m4 right-align" id="bookButtonWrap" style="display:none; margin-top: 25px;">
        <a href="/appointments/new" class="btn teal">
          <i class="material-icons left">add</i>
          Book Appointment
        </a>
      </div>
    </div>

    <div id="message"></div>

    <div class="card">
      <div class="card-content">
        <table class="striped responsive-table">
          <thead>
            <tr>
              <th>Patient</th>
              <th>Doctor</th>
              <th>Date & Time</th>
              <th>Reason</th>
              <th>Status</th>
              <th class="status-action">Action</th>
            </tr>
          </thead>

          <tbody id="appointmentsTable">
            <tr>
              <td colspan="6">Loading appointments...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    let currentUser = null;

    const tableBody = document.getElementById('appointmentsTable');
    const messageBox = document.getElementById('message');

    function showMessage(text, type = 'error') {
      const colour = type === 'success' ? 'green lighten-4 green-text text-darken-4' : 'red lighten-4 red-text text-darken-4';
      messageBox.innerHTML = `<div class="card-panel ${colour}">${text}</div>`;
    }

    function formatDate(value) {
      if (!value) return '-';

      return new Date(value).toLocaleString('en-AU', {
        dateStyle: 'medium',
        timeStyle: 'short'
      });
    }

    function canCreateAppointments() {
      return currentUser && ['admin', 'reception'].includes(currentUser.role);
    }

    function canUpdateStatus(appointment) {
      if (!currentUser) return false;

      if (['admin', 'reception'].includes(currentUser.role)) {
        return true;
      }

      if (currentUser.role === 'doctor') {
        return appointment.doctor && appointment.doctor._id === currentUser.id;
      }

      return false;
    }

    async function loadCurrentUser() {
      const response = await fetch('/me');
      const result = await response.json();

      if (!result.success) {
        window.location.href = '/login';
        return;
      }

      currentUser = result.user;

      if (canCreateAppointments()) {
        document.getElementById('bookButtonWrap').style.display = 'block';
        document.getElementById('bookNavItem').style.display = 'block';
      }
    }

    async function updateStatus(appointmentId, status) {
      const response = await fetch(`/appointments/${appointmentId}/status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });

      const result = await response.json();

      if (!result.success) {
        showMessage(result.message || 'Could not update status.');
        return;
      }

      showMessage(result.message, 'success');
      loadAppointments();
    }

    async function loadAppointments() {
      const response = await fetch('/appointments/data');
      const result = await response.json();

      if (!result.success) {
        tableBody.innerHTML = `<tr><td colspan="6">${result.message || 'Could not load appointments.'}</td></tr>`;
        return;
      }

      if (result.appointments.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="6">No appointments found.</td></tr>';
        return;
      }

      tableBody.innerHTML = '';

      result.appointments.forEach((appointment) => {
        const patientName = appointment.patient
          ? `${appointment.patient.firstName} ${appointment.patient.lastName}`
          : '-';

        const doctorName = appointment.doctor
          ? appointment.doctor.email
          : '-';

        let actionHtml = '-';

        if (canUpdateStatus(appointment)) {
          actionHtml = `
            <select onchange="updateStatus('${appointment._id}', this.value)" class="browser-default">
              <option value="Scheduled" ${appointment.status === 'Scheduled' ? 'selected' : ''}>Scheduled</option>
              <option value="Completed" ${appointment.status === 'Completed' ? 'selected' : ''}>Completed</option>
              <option value="Cancelled" ${appointment.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
            </select>
          `;
        }

        const row = `
          <tr>
            <td>${patientName}</td>
            <td>${doctorName}</td>
            <td>${formatDate(appointment.appointmentDate)}</td>
            <td>${appointment.reason}</td>
            <td>${appointment.status}</td>
            <td>${actionHtml}</td>
          </tr>
        `;

        tableBody.insertAdjacentHTML('beforeend', row);
      });
    }

    async function init() {
      await loadCurrentUser();
      await loadAppointments();
    }

    init();
  </script>
</body>
</html>

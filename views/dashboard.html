<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Dashboard | HMS</title>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
  />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <nav class="teal darken-2">
    <div class="nav-wrapper container">
      <a href="/dashboard" class="brand-logo">HMS</a>

      <ul class="right">
        <li class="role-link" data-roles="admin,reception,doctor,nurse">
  <a href="/patients">Patients</a>
</li>

<li class="role-link" data-roles="admin,reception">
  <a href="/patients/new">Register Patient</a>
</li>

<li class="role-link" data-roles="admin">
  <a href="/staff">Staff</a>
</li>

<li class="role-link" data-roles="patient">
  <a href="/profile">My Profile</a>
</li>

        <li>
          <button id="logoutButton" class="btn red darken-1 waves-effect waves-light">
            Logout
            <i class="material-icons right">logout</i>
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <main class="container dashboard-container">
    <div class="card z-depth-2">
      <div class="card-content">
        <span class="card-title">Secure Dashboard</span>

        <p id="userInfo">Loading user details...</p>

        <p class="grey-text text-darken-1">
          You are logged in securely. Your session will automatically expire after
          30 minutes of inactivity.
        </p>
      </div>
    </div>
  </main>

  <script src="/js/dashboard.js"></script>
  <script src="/js/session-timeout.js"></script>
</body>
</html>
